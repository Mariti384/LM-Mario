<!DOCTYPE html>
<html lang="es">
  <head>
      <meta charset="utf-8">
      <title>Reserva de habitación</title>
  </head>
  <body>
    <form action="reserva.php" method="get"></form>
      <fieldset>
        <legend>Datos del solicitante</legend>
        <label for="usuario">Nobre del solicitante de la reserva</label> <br />
        <input type="text" id="usuario" name="usuario" maxlenght="100" size="100" required autofocus/> <br />
        <label for="teléfono">Teléfono de contacto</label> <br />
        <input type="text" id="teléfono" name="teléfono" maxlenght="9" size="9" placeholder="9 números" pattern="[0-9]{9}" required/>
      </fieldset>
      <fieldset>
        <legend>Datos de la reserva</legend>
        <label for="habitación">Habitación:</label> <br />
        <select id="habitación" name="habitación" >
          <option value="azul" selected >Azul</option>
          <option value="verde" >Verde</option>
          <option value="amarilla" >Amarilla</option>
          <option value="morada" >Morada</option>
        </select> <br />
        <label for="ocupación">Ocupación:</label> <br />
        <select id="ocupación" name="ocupación" >
          <option value="individual" >Individual</option>
          <option value="doble" selected >Doble</option>
        </select> <br />
        <label for="provincia">Provincia:</label> <br />
        <select id="provincia" name="provincia" >
          <optgroup label="Galicia">
            <option value="coruña" >La Coruña</option>
            <option value="lugo" >Lugo</option>
            <option value="orense" >Orense</option>
            <option value="pontevedra" >Pontevedra</option>
          </optgroup>
          <optgroup label="País Vasco">
            <option value="vizcaya" >Vizcaya</option>
            <option value="guipúzcoa" >Guipúzcoa</option>
            <option value="álava" >Álava</option>
          </optgroup>
        </select> <br />
        <label for="dni">DNI (seleccine un archivo de imagen)</label>
        <input type="file" id="dni" name="dni" accept="image/*" multiple required/>
      </fieldset>
      <input type="submit" value="Enviar"/>
      <input type="reset" value="Limpiar"/>
    </form>
  </body>
</html>
