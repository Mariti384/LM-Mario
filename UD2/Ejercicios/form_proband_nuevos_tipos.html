<!DOCTYPE html>
<html lang="es">
  <head>
      <meta charset="utf-8">
      <title>Formularios</title>
  </head>
  <body>
    <p>Vamos a probar diferentes valores de type de HTML5 para la etiqueta <em>input</em></p>
    <form action="validar.php" method="get"></form>
      <fieldset>
        <legend>Para datos personales</legend>
        <label for="teléfono">Teléfono</label>
        <input type="text" id="teléfono" name="teléfono" maxlenght="9" size="9" placeholder="9 números" pattern="[0-9]{9}" autocomplete="on"/> <br />
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" maxlenght="50" size="50" placeholder="El formato correcto es nombre+@+servidor de correo" autocomplete="on"/>
      </fieldset>
      <fieldset>
        <legend>Para valores numéricos</legend>
        <label for="personas">Número de personas</label>
        <input type="number" id="personas" name="personas" min="1" max="20" step="1" vale="1"/> <br />
        <label for="puntuación">Mueve la barra para indicar puntuación (Del 1 al 10)</label>
        <input type="range" id="puntuación" name="puntuación" min="1" max="10" step="1" value="0"/>
      </fieldset>
      <fieldset>
        <legend>Url y búsqueda</legend>
        <label for="sitio">Url de tu sitio</label>
        <input type="url" id="sitio" name="sitio" maxlenght="50" size="50"/> <br />
        <label for="búsqueda">¿Qué te interesa buscar?</label>
        <input type="" id="búsqueda" name="búsqueda" min="1" maxlenght="50" size="50"/>
      </fieldset>
      <fieldset>
        <legend>Otros tipos</legend>
        <label for="color">Color</label>
        <input type="color" id="color" name="color" />
      </fieldset>
      <fieldset>
        <legend>Para fechas</legend>
        <label for="día">Seleccione un día (Hasta fin de año)</label>
        <input type="date" id="día" name="día" /> <br />
        <label for="hora">Seleccione una hora</label>
        <input type="time" id="hora" name="hora" /> <br />
        <label for="día">Seleccione un mes (Hasta junio del 2020)</label>
        <input type="month" id="día" name="día" /> <br />
        <label for="día">Seleccione un semana (Hasta junio del 2020)</label>
        <input type="week" id="día" name="día" /> <br />
        <label for="día">Seleccione fecha y hora</label>
        <input type="datetime-local" id="día" name="día" />
      </fieldset>
      <button type="submit">
        <img src="Imágenes/aceptar_50_50.png" 
            alt="Enviar"  
            width="10" height="10" />
      </button>
      <button type="reset">
        <img src="Imágenes/limpiar_50_50.png" 
            alt="Limpiar"
            width="10" height="10" />
      </button>
    </form>
  </body>
</html>
